<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício da Janela</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #container {
            background-color: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 1100px;
        }
        #titulo {
            font-size: 1.5em;
            color: #666;
            margin-bottom: 10px;
            margin-top: 0;
        }
        #estadoJanela {
            font-size: 2.8em;
            color: #0056b3;
            margin: 10px 0 30px 0;
            text-transform: uppercase;
            font-weight: 700;
        }
        #imagemJanela {
            width: 100%;
            max-width: 1000px;
            height: auto;
            border-radius: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="container">
        <p id="titulo">Abra a Janela</p>
        
        <h1 id="estadoJanela">Janela Fechada</h1>
        
        <img src="Janela fechada.png" id="imagemJanela" alt="Janela">
    </div>

    <script src="script.js"></script>

</body>
</html>
