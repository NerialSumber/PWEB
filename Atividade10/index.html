<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMC</title>
    <link rel="stylesheet" href="style.css">
    <script src="arquivo.js"></script>
</head>
<body>
    <main>
        <h1>IMC - Índice de Massa Corporal</h1>
        <section>
            <h3>Digite sua altura(m) e seu peso atual(Kg) para descobrir seu IMC</h3>
            <form class="formIMC">
                <div>
                    <label for="alt">Altura</label> <br>
                    <input type="number" id="alt"> <br><br>

                    <label for="peso">Peso Atual</label> <br>
                    <input type="number" id="peso"> <br><br>
                </div>
                <div>
                    <button type="button" onclick="resultIMC()">Calcular</button>
                    <button type="button" onclick="limpar()">Limpar</button>
                </div>
            </section>
        </form>
    </main>
</body>
</html>
